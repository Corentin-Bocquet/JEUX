<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>JEUX</title>
<meta name="description" content="Poker, blackjack, bowling, sudoku, mots fléchés et plein d'autres jeux à plusieurs, entre amis.">
<meta name="theme-color" content="#141432">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JEUX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/games.css">
<script>
  // thème appliqué avant l'affichage, pour éviter un flash
  (function () {
    try {
      var p = localStorage.getItem("jeux.theme") || "system";
      var dark = p === "dark" || (p === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"><div class="boot"><div class="logo">JEUX</div></div></div>
<script type="module" src="js/app.js"></script>
<noscript>JEUX a besoin de JavaScript pour fonctionner.</noscript>
</body>
</html>
