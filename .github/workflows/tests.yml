name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tests de la logique des jeux
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Parties complètes dans le navigateur
        run: |
          npx http-server -p 8765 -s -c-1 . &
          sleep 2
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: test-results
